name: Build slim OpenWrt for l1pro
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "slim = 去掉 docker / slim-docker = 保留 docker"
        required: false
        default: "slim"
        type: choice
        options:
          - slim
          - slim-docker
      openwrt_ip:
        description: "default LAN IP"
        required: false
        default: "192.168.1.1"
      kernel_version:
        description: "kernel"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 6.12.y
          - 6.18.y
jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    steps:
      - uses: actions/checkout@v6
      - name: Slim the rootfs
        run: |
          set -eux
          curl -fsSL -o rf.tar.gz "https://github.com/ophub/flippy-openwrt-actions/releases/download/OpenWrt_armv8_rootfs/2026.02.20-openwrt-armsr-armv8-generic-rootfs.tar.gz"
          mkdir -p rf && tar -xzf rf.tar.gz -C rf
          # 保留: LuCI 基础 / 文件共享 (luci-app-samba4 + samba4) / OpenClash (luci-app-openclash)
          DROP="openlist rclone verysync sing-box xray-core v2ray-plugin gost hysteria mosdns frps frpc kcptun-client ddns-go dnsproxy npc lucky netdata node luci-app-passwall luci-app-mosdns luci-app-dockerman"
          if [ "${{ inputs.profile }}" = "slim" ]; then DROP="$DROP docker dockerd docker-compose containerd"; fi
          for p in $DROP; do
            lst="rf/usr/lib/opkg/info/$p.list"
            if [ -f "$lst" ]; then
              sed 's|^/|rf/|' "$lst" | tr '\n' '\0' | xargs -0 -r rm -rf
              rm -f "rf/usr/lib/opkg/info/$p".*
              awk -v pkg="$p" 'BEGIN{RS="\n\n"} $0 ~ "^Package: "pkg"$" {next} {print $0"\n"}' rf/usr/lib/opkg/status > rf/usr/lib/opkg/status.new || true
              mv rf/usr/lib/opkg/status.new rf/usr/lib/opkg/status
            fi
          done
          # 固件指纹：刷机后能一眼确认是否真的跑的是这一版
          printf 'l1pro-slim OpenClash+Samba build %s\n' "$(date -u +%Y.%m.%d-%H%MUTC)" > rf/etc/slim-mark
          sed -i "s/^.*option hostname.*$/\toption hostname 'l1pro-slim'/" rf/etc/config/system || true
          echo "已删包: $DROP"
          echo "剩余已装包数量: $(ls rf/usr/lib/opkg/info/*.list | wc -l)"
          du -sh rf
          tar --owner=0 --group=0 --numeric-owner -czf slim-rootfs.tar.gz -C rf .
          ls -lh slim-rootfs.tar.gz
      - name: Package OpenWrt Firmware
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: slim-rootfs.tar.gz
          SAVE_OPENWRT_ROOTFS: "false"
          PACKAGE_SOC: l1pro
          CUSTOMIZE_RK3399: none
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: ${{ inputs.openwrt_ip }}
          WHOAMI: yourname
          GZIP_IMGS: gz
      - name: Upload Firmware
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: slim-l1pro-${{ inputs.profile }}-${{ env.PACKAGED_OUTPUTDATE }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: error
          compression-level: 0
