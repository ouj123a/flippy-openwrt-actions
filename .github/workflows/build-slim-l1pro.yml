name: Build slim OpenWrt for l1pro
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "slim = 去掉 docker / slim-docker = 保留 docker"
        required: false
        default: "slim"
        type: choice
        options:
          - slim
          - slim-docker
      openwrt_ip:
        description: "default LAN IP"
        required: false
        default: "192.168.1.1"
      kernel_version:
        description: "kernel"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 6.12.y
          - 6.18.y
jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    steps:
      - uses: actions/checkout@v6
      - name: Slim the rootfs (whitelist + dependency closure)
        run: |
          set -eux
          curl -fsSL -o rf.tar.gz "https://github.com/ophub/flippy-openwrt-actions/releases/download/OpenWrt_armv8_rootfs/2026.02.20-openwrt-armsr-armv8-generic-rootfs.tar.gz"
          mkdir -p rf && tar -xzf rf.tar.gz -C rf
          python3 - <<'PY'
          import os, re, sys, glob

          root = sys.argv[1] if len(sys.argv) > 1 else "rf"
          info = os.path.join(root, "usr/lib/opkg/info")
          pkgs, cur = {}, None
          for line in open(os.path.join(root, "usr/lib/opkg/status"), encoding="utf-8", errors="ignore"):
              if line.startswith("Package:"):
                  cur = line.split(":", 1)[1].strip(); pkgs.setdefault(cur, [])
              elif line.startswith("Depends:") and cur:
                  pkgs[cur] = [re.sub(r"[<>=() ].*", "", d).strip() for d in line.split(":", 1)[1].split(",") if d.strip()]
          names = set(pkgs)

          lists = {}
          for lf in glob.glob(info + "/*.list"):
              pkg = os.path.basename(lf)[:-5]
              try:
                  lists[pkg] = [ln.strip() for ln in open(lf, encoding="utf-8", errors="ignore") if ln.strip()]
              except Exception:
                  lists[pkg] = []

          owner_index = {}
          for pkg, paths in lists.items():
              for p in paths:
                  owner_index.setdefault(p, set()).add(pkg)

          def owners(path):
              return owner_index.get(path, set())

          seeds = set("""busybox base-files kernel procd uci ubus ubusd jshn jsonfilter libubox libubus libuci netifd fstools
          block-mount blkid btrfs-progs lua ucode ubox opkg ip-full
          dnsmasq-full firewall odhcpd-ipv6only openssh-server openssh-client uhttpd rpcd logd
          luci-base luci-i18n-base-zh-cn luci-mod-admin-full luci-mod-network luci-mod-status luci-mod-system luci-theme-bootstrap
          luci-app-openclash luci-app-samba4 samba4-server samba4-libs
          curl wget-ssl bash ipset iptables nftables openssl-util ethtool
          ca-bundle ca-certificates libustream-openssl libopenssl3
          coreutils-base64 coreutils-nohup coreutils-realpath coreutils-split coreutils-timeout openssh-keygen xz tc-tiny ruby unzip""".split()) & names

          for svc in ["network", "dnsmasq", "firewall", "odhcpd", "sshd", "uhttpd", "samba4", "rpcd", "fstab", "boot", "system", "log"]:
              seeds |= owners("/etc/init.d/" + svc) & names

          keep = set(p for p in names if p.startswith("kmod-")) | seeds

          def closure(k):
              changed = True
              while changed:
                  changed = False
                  for p in list(k):
                      for dep in pkgs.get(p, []):
                          if dep in names and dep not in k:
                              k.add(dep); changed = True
              while True:
                  need = set(p for p in k if p.startswith("kmod-"))
                  for p in k:
                      need |= set(d for d in pkgs.get(p, []) if d in k)
                  # seeds 永远保留
                  need |= (seeds & names)
                  if need == k:
                      break
                  k = need
              return k

          keep = closure(keep)

          # 迭代：保留包里的符号链接目标，其提供者也要保留
          for _ in range(6):
              added = False
              prot = set()
              for p in keep:
                  prot |= set(lists.get(p, []))
              for p in prot:
                  fp = os.path.join(root, p.lstrip('/'))
                  if os.path.islink(fp):
                      t = os.readlink(fp)
                      tgt = t if os.path.isabs(t) else os.path.normpath(os.path.join(os.path.dirname(p), t))
                      tw = os.path.join(root, tgt.lstrip('/'))
                      if not os.path.exists(tw):
                          continue
                      for o in owners(tgt):
                          if o not in keep:
                              keep.add(o); seeds.add(o); added = True
              keep = closure(keep)
              if not added:
                  break

          protected = set()
          for p in keep:
              protected |= set(lists.get(p, []))

          drop = sorted(names - keep)
          skipped = 0
          for p in drop:
              for f in lists.get(p, []):
                  if f in protected:
                      skipped += 1
                      continue
                  fp = root + f
                  try:
                      if os.path.islink(fp) or os.path.isfile(fp):
                          os.unlink(fp)
                  except OSError:
                      pass
              for ext in [".list", ".control", ".md5sum", ".postinst", ".prerm", ".conffiles", ".preinst", ".postrm", ".version", ".depends"]:
                  f2 = os.path.join(info, p + ext)
                  if os.path.exists(f2):
                      os.unlink(f2)

          rmd = os.path.join(root, "etc/rc.d")
          if os.path.isdir(rmd):
              for s in os.listdir(rmd):
                  p = os.path.join(rmd, s)
                  if os.path.islink(p):
                      tgt = os.readlink(p)
                      tgt = tgt if os.path.isabs(tgt) else os.path.join(rmd, tgt)
                      if not os.path.exists(root + tgt) and not os.path.exists(tgt):
                          os.unlink(p)

          def exists_in_root(rel):
              fp = os.path.join(root, rel)
              seen = 0
              while os.path.islink(fp) and seen < 10:
                  t = os.readlink(fp)
                  fp = os.path.normpath(os.path.join(root, t.lstrip("/")) if os.path.isabs(t) else os.path.join(os.path.dirname(fp), t))
                  seen += 1
              return os.path.exists(fp)

          must = ["bin/busybox", "sbin/procd", "sbin/ubusd", "sbin/kmodloader", "sbin/ip", "bin/opkg", "usr/bin/jshn",
                  "usr/share/libubox/jshn.sh", "usr/bin/lua", "usr/bin/ucode", "usr/sbin/blkid", "usr/sbin/dnsmasq",
                  "usr/sbin/uhttpd", "usr/sbin/sshd", "usr/sbin/iptables", "etc/init.d/network", "etc/init.d/firewall",
                  "etc/init.d/dnsmasq", "etc/init.d/odhcpd", "usr/lib/lua/luci/controller", "usr/sbin/smbd", "bin/bash",
                  "usr/bin/curl", "usr/bin/awk", "bin/gzip", "bin/tar"]
          miss = [m for m in must if not exists_in_root(m)]
          print("kept pkgs: %d   dropped pkgs: %d   shared-paths skipped: %d" % (len(keep), len(drop), skipped))
          print("missing critical files: %s" % (miss if miss else "none"))
          if miss:
              sys.exit(1)
          PY
          rm -f rf/usr/lib/lua/luci/controller/admin/filebrowser.lua
          find rf/usr/lib/lua/luci/controller rf/usr/lib/lua/luci/view -mindepth 1 -type d -empty -delete 2>/dev/null || true
          if [ "${{ inputs.profile }}" = "slim" ]; then
            python3 - <<'PY'
          import os
          root = "rf"; info = os.path.join(root, "usr/lib/opkg/info")
          extra = ["docker", "dockerd", "docker-compose", "containerd"]
          for p in extra:
              lf = os.path.join(info, p + ".list")
              if os.path.exists(lf):
                  for f in open(lf, encoding="utf-8", errors="ignore"):
                      fp = root + f.strip()
                      if f.strip():
                          try:
                              if os.path.islink(fp) or os.path.isfile(fp):
                                  os.unlink(fp)
                          except OSError:
                              pass
                  os.unlink(lf)
          print("docker cleaned")
          PY
          fi
          printf 'l1pro-slim OpenClash+Samba build %s\n' "$(date -u +%Y.%m.%d-%H%MUTC)" > rf/etc/slim-mark
          sed -i "s/^.*option hostname.*$/\toption hostname 'l1pro-slim'/" rf/etc/config/system || true
          echo "剩余包: $(ls rf/usr/lib/opkg/info/*.list | wc -l)"
          du -sh rf
          tar --owner=0 --group=0 --numeric-owner -czf slim-rootfs.tar.gz -C rf .
          ls -lh slim-rootfs.tar.gz
      - name: Package OpenWrt Firmware
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: slim-rootfs.tar.gz
          SAVE_OPENWRT_ROOTFS: "false"
          PACKAGE_SOC: l1pro
          CUSTOMIZE_RK3399: none
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: ${{ inputs.openwrt_ip }}
          WHOAMI: yourname
          GZIP_IMGS: gz
      - name: Upload Firmware
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: slim-l1pro-${{ inputs.profile }}-${{ env.PACKAGED_OUTPUTDATE }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: error
          compression-level: 0
