name: Build slim OpenWrt for l1pro
on:
  workflow_dispatch:
    inputs:
      rootfs_source:
        description: "rootfs: official / immortalwrt / flippy-full"
        required: false
        default: "immortalwrt"
        type: choice
        options:
          - immortalwrt
          - official
          - flippy-full
      openwrt_ip:
        description: "default LAN IP"
        required: false
        default: "192.168.1.1"
      kernel_version:
        description: "kernel"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 6.12.y
          - 6.18.y
jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve rootfs url
        id: rf
        run: |
          case "${{ inputs.rootfs_source }}" in
            immortalwrt) u="https://downloads.immortalwrt.org/releases/24.10.4/targets/armsr/armv8/immortalwrt-24.10.4-armsr-armv8-rootfs.tar.gz" ;;
            flippy-full) u="https://github.com/ophub/flippy-openwrt-actions/releases/download/OpenWrt_armv8_rootfs/2026.02.20-openwrt-armsr-armv8-generic-rootfs.tar.gz" ;;
            *) u="https://downloads.openwrt.org/releases/24.10.4/targets/armsr/armv8/openwrt-24.10.4-armsr-armv8-rootfs.tar.gz" ;;
          esac
          echo "url=$u" >> $GITHUB_OUTPUT
      - name: Package OpenWrt Firmware
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ steps.rf.outputs.url }}
          PACKAGE_SOC: l1pro
          CUSTOMIZE_RK3399: none
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: ${{ inputs.openwrt_ip }}
          WHOAMI: yourname
          GZIP_IMGS: gz
      - name: Upload Firmware
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: slim-l1pro-${{ inputs.rootfs_source }}-${{ env.PACKAGED_OUTPUTDATE }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: error
          compression-level: 0
